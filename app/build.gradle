plugins { id 'com.android.application' }

android {
    namespace 'com.ashudeveloper.soundmodetile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ashudeveloper.soundmodetile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
